name: Build AstraMind APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AstraMind
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          if [ ! -f AstraMind-Android-Starter.zip ]; then
            echo "AstraMind-Android-Starter.zip is missing from repository root"
            exit 1
          fi
          unzip -o AstraMind-Android-Starter.zip -d .

      - name: Download llama.cpp
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp.git app/src/main/cpp/llama.cpp

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3

      - name: Install native build tools
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AstraMind-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
