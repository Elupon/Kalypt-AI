name: Build Kalypt APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    # ubuntu-latest уже переезжает на Ubuntu 26, где нет предустановленного Android SDK.
    # Закрепляем 24.04: там SDK и sdkmanager есть из коробки.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Kalypt
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          test -f Kalypt-Android.zip || {
            echo "Kalypt-Android.zip is missing from repository root"
            exit 1
          }
          unzip -o Kalypt-Android.zip -d .
          test -f app/build.gradle.kts
          test -f app/src/main/cpp/CMakeLists.txt
          test -f app/src/main/cpp/native-lib.cpp

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub-hosted Ubuntu runners already include Android command-line tools.
      - name: Install Android SDK packages
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          which sdkmanager
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      # Версия llama.cpp закреплена тегом: нативный код написан под её API,
      # а свежий master может сломать сборку.
      - name: Download llama.cpp
        run: |
          git clone --depth 1 --branch b5600 https://github.com/ggml-org/llama.cpp.git \
            app/src/main/cpp/llama.cpp

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kalypt-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
